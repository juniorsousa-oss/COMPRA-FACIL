name: Corrigir segundo item
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correção
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')
          old='''    with a:\n        if st.button("Adicionar produto à lista de compras",type="primary",use_container_width=True,key="open_add_list"):\n            if not current:\n                budget_dialog("add")\n            else:\n                add_list_dialog(products)\n'''
          new='''    with a:\n        if not current:\n            if st.button("Adicionar produto à lista de compras",type="primary",use_container_width=True,key="open_add_list"):\n                budget_dialog("add")\n        else:\n            with st.popover("Adicionar produto à lista de compras",use_container_width=True):\n                names=[p.get("nome","") for p in products if p.get("nome")]\n                selected=st.selectbox("Produto",names,key="add_product_select")\n                qty=st.number_input("Quantidade",min_value=.001,value=1.,step=1.,format="%.2f",key="add_product_qty")\n                p=find_product(products,selected)\n                if st.button("Adicionar à lista",type="primary",use_container_width=True,key="add_product_submit") and p:\n                    add_item(selected,p.get("categoria","Mercearia"),p.get("unidade","un."),qty,num(p.get("ultimo_preco")))\n                    st.rerun()\n'''
          if old not in s: raise SystemExit('Bloco do botão de adicionar não encontrado')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Usa popover para adicionar itens subsequentes" || exit 0
          git push
