name: Corrigir erro de indice
on:
  push:
    branches: [main]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validar Python
        run: python -m py_compile app.py
      - name: Atualizar estatisticas ao excluir historico
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')
          old='''def delete_history_purchase(pid): db("itens_compra","DELETE",params={"compra_id":f"eq.{pid}"}); db("compras","DELETE",params={"id":f"eq.{pid}"}); clear()'''
          new='''def rebuild_product_stats_after_history_delete():
              products=db("produtos",params={"select":"id"})
              items=db("itens_compra",params={"select":"produto_id,compra_id,preco_unitario,quantidade,criado_em"})
              grouped={}
              for x in items:
                  if x.get("produto_id") is not None: grouped.setdefault(str(x["produto_id"]),[]).append(x)
              for p in products:
                  rows=grouped.get(str(p.get("id")),[])
                  if rows:
                      valid=[x for x in rows if num(x.get("preco_unitario"))>0]
                      prices=[num(x.get("preco_unitario")) for x in valid]
                      latest=sorted(rows,key=lambda x:str(x.get("criado_em","")))[-1]
                      data={"ultimo_preco":num(latest.get("preco_unitario")),"preco_medio":sum(prices)/len(prices) if prices else 0,"menor_preco":min(prices) if prices else 0,"maior_preco":max(prices) if prices else 0,"ultima_quantidade":num(latest.get("quantidade")) or 1,"quantidade_compras":len({str(x.get("compra_id")) for x in rows}),"atualizado_em":now()}
                  else:
                      data={"ultimo_preco":0,"preco_medio":0,"menor_preco":0,"maior_preco":0,"ultima_quantidade":1,"quantidade_compras":0,"atualizado_em":now()}
                  db("produtos","PATCH",params={"id":f"eq.{p['id']}"},data=data)

def delete_history_purchase(pid):
    db("itens_compra","DELETE",params={"compra_id":f"eq.{pid}"})
    db("compras","DELETE",params={"id":f"eq.{pid}"})
    rebuild_product_stats_after_history_delete()
    clear()'''
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Adicionar opcao Alterar em cada item
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')
          old='''        d1,d2=st.columns([3,1])
        with d1:
            st.caption(f"Total pago: {money(num(item.get('quantidade'))*num(item.get('preco_unitario')))}" if ok else "Aguardando confirmação do preço")
        with d2:
            if st.button("Excluir",key=f"d{item['id']}",use_container_width=True):
                remove_item(item["id"]); st.rerun()
'''
          new='''        d1,d2,d3=st.columns([3,1,1])
        with d1:
            st.caption(f"Total pago: {money(num(item.get('quantidade'))*num(item.get('preco_unitario')))}" if ok else "Aguardando confirmação do preço")
        with d2:
            with st.popover("Alterar",use_container_width=True):
                names=[p.get("nome","") for p in products if p.get("nome")]
                current_name=item.get("nome_produto","")
                current_index=names.index(current_name) if current_name in names else 0
                edit_name=st.selectbox("Produto",names,index=current_index,key=f"edit_product_{item['id']}")
                edit_qty=st.number_input("Quantidade",min_value=.001,value=num(item.get("quantidade")) or 1.,step=1.,format="%.2f",key=f"edit_qty_{item['id']}")
                if st.button("Salvar alteração",type="primary",use_container_width=True,key=f"edit_save_{item['id']}"):
                    p=find_product(products,edit_name)
                    if p:
                        edit_item(item["id"],nome_produto=edit_name,categoria=p.get("categoria","Mercearia"),unidade=p.get("unidade","un."),quantidade=edit_qty,preco_estimado=num(p.get("ultimo_preco")),preco_unitario=0,confirmado=False)
                        st.rerun()
        with d3:
            if st.button("Excluir",key=f"d{item['id']}",use_container_width=True):
                remove_item(item["id"]); st.rerun()
'''
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Validar novamente
        run: python -m py_compile app.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py .github/workflows/fix-index-error.yml
          git diff --cached --quiet && exit 0
          git commit -m 'feat: permite alterar item da compra'
          git push
