name: Fix budget flow
on:
  push:
    paths:
      - '.github/workflows/fix-budget-flow.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch budget behavior
        run: python .github/scripts/fix_budget.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app_original.py
          git diff --cached --quiet || git commit -m 'Corrige orçamento ao esvaziar lista e permite ajuste'
          git push
