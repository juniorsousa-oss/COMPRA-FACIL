name: Fix budget flow
on:
  push:
    paths:
      - '.github/workflows/fix-budget-flow.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch budget behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app_original.py')
          s=p.read_text(encoding='utf-8')
          old='def remove_item(i): db("lista_atual","DELETE",params={"id":f"eq.{i}"}); clear()'
          new='''def remove_item(i):
              db("lista_atual","DELETE",params={"id":f"eq.{i}"})
              remaining=db("lista_atual",params={"select":"id","id":"gt.0","limit":1})
              if not remaining:
                  save_budget(0)
              else:
                  clear()'''
          if old not in s:
              raise SystemExit('remove_item target not found')
          s=s.replace(old,new,1)
          marker='buy,prod,hist,ana,config=st.tabs(["🛒 Compra","📦 Produtos","📜 Histórico","📊 Análises","⚙️ Configurações"])'
          insert='''buy,prod,hist,ana,config=st.tabs(["🛒 Compra","📦 Produtos","📜 Histórico","📊 Análises","⚙️ Configurações"])

# Ajuste rápido do orçamento da compra em andamento.
if budget>0:
    with st.popover("Corrigir orçamento",use_container_width=False):
        st.caption("Corrija o valor informado no início da compra.")
        if "budget_edit_value" not in st.session_state:
            st.session_state["budget_edit_value"]=budget
        new_budget=st.number_input("Novo orçamento (R$)",min_value=0.0,value=float(st.session_state["budget_edit_value"]),step=10.0,format="%.2f",key="budget_edit_value")
        if st.button("Salvar novo orçamento",type="primary",use_container_width=True,key="save_budget_edit"):
            if new_budget<=0:
                st.error("Informe um orçamento maior que zero.")
            else:
                save_budget(new_budget)
                st.success("Orçamento atualizado.")
                st.rerun()'''
          if marker not in s:
              raise SystemExit('tabs marker not found')
          s=s.replace(marker,insert,1)
          p.write_text(s,encoding='utf-8')
          import ast
          ast.parse(s)
          print('app_original.py OK')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app_original.py
          git diff --cached --quiet || git commit -m 'Corrige orçamento ao esvaziar lista e permite ajuste'
          git push
# trigger
