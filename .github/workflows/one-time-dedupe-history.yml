name: One-time dedupe history patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        env:
          OLD: |
            def stage_history(uploaded,products):
                rows=parse_history(uploaded); exact=[]; unmatched=[]
                for x in rows:
                    p=find_product(products,x["name"])
                    if p: exact.append({**x,"product":p})
                    else: unmatched.append({**x,"suggestions":suggestions(x["name"],products),"action":"novo","selected":None,"new_category":"Mercearia","new_unit":"un."})
                st.session_state["pending_history"]={"exact":exact,"unmatched":unmatched}
          NEW: |
            def stage_history(uploaded,products):
                rows=parse_history(uploaded); exact=[]; unmatched=[]
                # Antes de sugerir vínculos, consolidar itens NÃO cadastrados repetidos.
                # Duplicatas por descrição normalizada são apresentadas uma única vez.
                # Quantidades são somadas e o preço unitário vira média ponderada, preservando o valor total.
                grouped={}
                for x in rows:
                    p=find_product(products,x["name"])
                    if p:
                        exact.append({**x,"product":p})
                        continue
                    key=norm(x["name"])
                    if key not in grouped:
                        grouped[key]={**x,"duplicate_count":1}
                    else:
                        g=grouped[key]
                        old_qty=num(g["qty"]); new_qty=num(x["qty"]); total_qty=old_qty+new_qty
                        g["price"]=(old_qty*num(g["price"])+new_qty*num(x["price"])) / total_qty if total_qty else num(x["price"])
                        g["qty"]=total_qty
                        g["last"]=num(x.get("last")) or g.get("last",0)
                        g["duplicate_count"]=g.get("duplicate_count",1)+1
                for x in grouped.values():
                    x.update({"suggestions":suggestions(x["name"],products),"action":"novo","selected":None,"new_category":"Mercearia","new_unit":"un."})
                    unmatched.append(x)
                st.session_state["pending_history"]={"exact":exact,"unmatched":unmatched}
      - name: Patch app and remove workflow
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')
          old=os.environ['OLD'].replace('\\n','\n')
          new=os.environ['NEW'].replace('\\n','\n')
          if old not in s:
              raise SystemExit('stage_history block not found; refusing to modify the app')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py .github/workflows/one-time-dedupe-history.yml
          git rm .github/workflows/one-time-dedupe-history.yml
          git commit -m 'Filtrar duplicados de itens não cadastrados no histórico'
          git push
