name: Group purchase items
on:
  push:
    paths:
      - '.github/workflows/group-purchase-items.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app.py
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')
          old='''            q=st.number_input("Qtd",min_value=.001,value=num(item.get("quantidade")) or 1.,step=1.,key=f"q{item['id']}",disabled=ok)\n            if q!=num(item.get("quantidade")) and not ok: edit_item(item["id"],quantidade=q); st.rerun()'''
          new='''            q=st.number_input("Qtd",min_value=.001,value=num(item.get("quantidade")) or 1.,step=1.,key=f"q{item['id']}",disabled=False,help="A quantidade pode ser corrigida mesmo depois da confirmação.")\n            if q!=num(item.get("quantidade")):\n                edit_item(item["id"],quantidade=q,confirmado=ok)\n                st.rerun()'''
          if old not in s:
              raise SystemExit('Campo de quantidade não encontrado')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m 'Permite alterar quantidade de item confirmado'
          git push
