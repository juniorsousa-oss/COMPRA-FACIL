name: Ajustar moeda do orçamento

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ajustar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Ajustar campo de orçamento
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          old = 'st.number_input(\"Orçamento disponível\",min_value=0.01,value=0.01,step=10.00,format=\"%.2f\",key=\"new_purchase_budget\")'
          new = 'st.number_input(\"Orçamento disponível (R$)\",min_value=0.01,value=0.01,step=10.00,format=\"%.2f\",key=\"new_purchase_budget\")'
          if old not in s:
              raise SystemExit('Trecho do orçamento não encontrado')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Salvar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Exibe orçamento em reais" || exit 0
          git push
