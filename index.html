<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Compra Fácil V6</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--primary:#111827;--accent:#2563eb;--ok:#15803d;--danger:#b91c1c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:30px}header{background:var(--primary);color:#fff;padding:18px;position:sticky;top:0;z-index:5}.brand{font-size:22px;font-weight:850}.sub{font-size:12px;color:#cbd5e1;margin-top:3px}.container{padding:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:15px}.metric-label,.small{font-size:12px;color:var(--muted)}.metric{font-size:22px;font-weight:850;margin-top:5px}.ok{color:var(--ok)}.danger{color:var(--danger)}button,input,select{font:inherit}button{border:0;cursor:pointer}.primary{width:100%;background:var(--accent);color:#fff;border-radius:12px;padding:13px;font-weight:800}.secondary{background:#eef2f7;color:#111827;border-radius:10px;padding:10px 12px;font-weight:700}.section-title{display:flex;justify-content:space-between;align-items:center;gap:8px}.section-title h2{font-size:16px;margin:0}.product{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.product:last-child{border:0}.check{width:26px;height:26px;border:2px solid #9ca3af;border-radius:8px;background:#fff}.check.done{background:var(--ok);border-color:var(--ok);color:#fff}.info{flex:1}.name{font-weight:750}.strike{text-decoration:line-through;color:#9ca3af}.price{font-weight:800}.remove{background:#fee2e2;color:#991b1b;padding:8px;border-radius:8px}.empty{text-align:center;color:var(--muted);padding:25px}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:end center;z-index:20}.modal.show{display:grid}.modalbox{background:#fff;width:min(760px,100%);border-radius:20px 20px 0 0;padding:18px;max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between}.close{background:#eef2f7;border-radius:50%;width:34px;height:34px;font-size:20px}input,select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:10px;margin:5px 0 10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.compare{padding:12px;border-radius:12px;background:#f3f4f6;margin:10px 0}.tabs{display:flex;gap:8px;overflow:auto;margin-top:15px}.tabs button{white-space:nowrap}.hidden{display:none!important}@media(min-width:761px){.modal{place-items:center}.modalbox{border-radius:20px;width:580px}}
</style></head>
<body><div class="app"><header><div class="brand">Compra Fácil</div><div class="sub">V6 · fluxo de compra</div></header><main class="container">
<div class="grid"><div class="card"><div class="metric-label">Valor em caixa</div><div id="budget" class="metric">R$ 0,00</div></div><div class="card"><div class="metric-label">Valor estimado</div><div id="estimated" class="metric">R$ 0,00</div></div><div class="card"><div class="metric-label">Valor real</div><div id="real" class="metric ok">R$ 0,00</div></div><div class="card"><div class="metric-label">Itens</div><div id="count" class="metric">0 / 0</div></div></div>
<div class="card"><div class="section-title"><h2>Lista atual</h2><button class="secondary" onclick="addProduct()">+ Produto</button></div><div id="list"></div></div>
<div class="tabs"><button class="secondary" onclick="setBudget()">💰 Caixa</button><button class="secondary" onclick="usual()">Lista habitual</button><button class="secondary" onclick="clearList()">Limpar lista</button></div>
</main></div>
<div id="modal" class="modal"><div class="modalbox"><div class="modalhead"><h3 id="title">Confirmar compra</h3><button class="close" onclick="closeModal()">×</button></div><div id="productName" class="name"></div><label>Quantidade</label><input id="qty" type="number" min=".01" step=".01"><label>Preço unitário atual</label><input id="price" type="number" min="0" step=".01" oninput="compare()"><div id="comparison" class="compare"></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="confirmBuy()">Confirmar compra</button></div></div></div>
<script>
const KEY='compra_facil_v6_demo';let state=JSON.parse(localStorage.getItem(KEY)||'null')||{budget:0,products:[],catalog:{Arroz:16.9,Feijão:6.98,Macarrão:6.98,Frango:17.99,Leite:4.99}};let current=-1;
const money=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function estimatedTotal(){return state.products.reduce((s,p)=>s+p.qty*(p.estimated||0),0)}function realTotal(){return state.products.reduce((s,p)=>s+(p.done?p.qty*p.realPrice:0),0)}
function render(){budget.textContent=money(state.budget);estimated.textContent=money(estimatedTotal());real.textContent=money(realTotal());count.textContent=state.products.filter(p=>p.done).length+' / '+state.products.length;list.innerHTML=state.products.length?state.products.map((p,i)=>`<div class="product"><button class="check ${p.done?'done':''}" onclick="start(${i})">${p.done?'✓':''}</button><div class="info"><div class="name ${p.done?'strike':''}">${p.name}</div><div class="small">${p.qty} un. · ${p.done?money(p.realPrice)+' real':'estimado '+money(p.estimated)}</div></div><div class="price">${money(p.done?p.qty*p.realPrice:p.qty*p.estimated)}</div><button class="remove" onclick="removeItem(${i})">🗑</button></div>`).join(''):'<div class="empty">Sua lista está vazia.</div>'}
function setBudget(){let v=prompt('Valor disponível:',state.budget||'');if(v!==null&&!isNaN(Number(v.replace(',','.')))){state.budget=Number(v.replace(',','.'));save();render()}}
function addProduct(){let n=prompt('Nome do produto:');if(!n)return;let q=prompt('Quantidade:',1);q=Number(q)||1;let key=Object.keys(state.catalog).find(x=>x.toLowerCase()===n.toLowerCase());state.products.push({name:n,qty:q,estimated:key?state.catalog[key]:0,realPrice:0,done:false});save();render()}
function start(i){if(state.products[i].done)return;current=i;let p=state.products[i];productName.textContent=p.name;qty.value=p.qty;price.value='';compare();modal.classList.add('show');price.focus()}
function compare(){let p=state.products[current];if(!p)return;let v=Number(price.value)||0;let last=p.estimated||0;comparison.innerHTML=`Último preço: <strong>${last?money(last):'sem histórico'}</strong><br>Preço atual: <strong>${v?money(v):'—'}</strong>${last&&v?`<br>Variação: <strong>${((v/last-1)*100).toFixed(1)}%</strong>`:''}`}
function confirmBuy(){let p=state.products[current],q=Number(qty.value),v=Number(price.value);if(!p||q<=0||v<=0){alert('Informe quantidade e preço.');return}let last=p.estimated;if(last&&v>last*1.1&&!confirm(`O preço está ${((v/last-1)*100).toFixed(1)}% acima do último registrado. Continuar?`))return;p.qty=q;p.realPrice=v;p.done=true;state.catalog[p.name]=v;save();closeModal();render()}
function closeModal(){modal.classList.remove('show');current=-1}function removeItem(i){if(confirm('Remover este item da lista?')){state.products.splice(i,1);save();render()}}function clearList(){if(confirm('Limpar a lista atual?')){state.products=[];save();render()}}function usual(){Object.entries(state.catalog).forEach(([name,last])=>{if(!state.products.some(p=>p.name.toLowerCase()===name.toLowerCase()))state.products.push({name,qty:1,estimated:last,realPrice:0,done:false})});save();render()}
render();
</script></body></html>
